services:
  app:
    build: .
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mcp_support_desk
      SPRING_DATASOURCE_USERNAME: mcp_support_desk
      SPRING_DATASOURCE_PASSWORD: mcp_support_desk
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      SPRING_AI_ANTHROPIC_API_KEY: ${SPRING_AI_ANTHROPIC_API_KEY:-}
      SPRING_AI_ANTHROPIC_CHAT_MODEL: ${SPRING_AI_ANTHROPIC_CHAT_MODEL:-}
      SUPPORT_FREE_TEXT_MCP_URL: ${SUPPORT_FREE_TEXT_MCP_URL:-http://localhost:8080/mcp}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mcp_support_desk
      POSTGRES_USER: mcp_support_desk
      POSTGRES_PASSWORD: mcp_support_desk
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_support_desk -d mcp_support_desk"]
      interval: 5s
      timeout: 5s
      retries: 10
